<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>منظم المنزل</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;background:#0b1020;color:#fff;overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.top{padding:14px 14px 10px;background:linear-gradient(135deg,#111a33,#1b2a4d);border-bottom:1px solid #ffffff18}.title{font-size:20px;font-weight:800}.sub{font-size:12px;color:#b9c5df;margin-top:2px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:#0e1528;border-bottom:1px solid #ffffff14}.nav button{border:1px solid #ffffff1f;border-radius:14px;background:#151f38;color:#dce6ff;padding:10px 6px;font-weight:800;font-size:13px}.nav button.active{background:#315b9b;color:white;border-color:#6ca7ff}.stage{position:relative;flex:1;min-height:0}.pane{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:white}.pane.active{display:block}</style></head><body><div class="app"><div class="top"><div class="title">مفكرتي · مستنداتي · صيانة البيت</div><div class="sub">مفكرتي ومستنداتي وصيانة المنزل — بيانات مستقلة ونسخ احتياطية</div></div><div class="nav"><button id="bMemo" class="active" onclick="showPane('memo',this)">📝 مفكرتي</button><button id="bDocs" onclick="showPane('docs',this)">📁 مستنداتي</button><button id="bMaint" onclick="showPane('maint',this)">🏠 صيانة البيت</button></div><div class="stage"><iframe id="memo" class="pane active" src="file:///android_asset/memo.html"></iframe><iframe id="docs" class="pane" src="file:///android_asset/documents.html"></iframe><iframe id="maint" class="pane" src="file:///android_asset/maintenance.html"></iframe></div></div><script>function showPane(id,btn){document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active')} </script></body></html>
