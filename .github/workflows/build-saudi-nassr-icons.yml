name: Build Saudi and Al Nassr Icon Packs
on:
  push:
    branches: [ "saudi-nassr-icon-packs-test" ]
    paths:
      - "saudi-icon-pack/**"
      - "alnassr-icon-pack/**"
      - ".github/workflows/build-saudi-nassr-icons.yml"
  workflow_dispatch:

jobs:
  build-saudi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Saudi APK
        working-directory: saudi-icon-pack
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BAS-Saudi-Icons-Test
          path: saudi-icon-pack/app/build/outputs/apk/debug/app-debug.apk

  build-alnassr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Al Nassr APK
        working-directory: alnassr-icon-pack
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BAS-Al-Nassr-Icons-Test
          path: alnassr-icon-pack/app/build/outputs/apk/debug/app-debug.apk
