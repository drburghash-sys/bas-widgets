name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bms-widgets-debug-keystore-v2
      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore ~/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=BMS Widgets,O=BMS,C=SA"               -keyalg RSA -keysize 2048 -validity 10000
          fi
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BMS-Widgets-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
