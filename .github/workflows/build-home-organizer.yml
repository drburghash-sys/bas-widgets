name: Build Home Organizer Widget
on:
  push:
    branches: [ "home-organizer-widget-v42" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release
        run: gradle -p home-organizer-native clean assembleRelease
      - name: Align APK and collect signer
        shell: bash
        run: |
          set -e
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p out
          "$BT/zipalign" -f 4             home-organizer-native/app/build/outputs/apk/release/app-release-unsigned.apk             out/Home_Organizer_V4_2_Widget_unsigned_aligned.apk
          cp "$BT/lib/apksigner.jar" out/apksigner.jar
          "$BT/zipalign" -c -v 4 out/Home_Organizer_V4_2_Widget_unsigned_aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Home-Organizer-V4.2-Widget-Unsigned
          path: out/*
