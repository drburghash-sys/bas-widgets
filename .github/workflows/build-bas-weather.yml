name: Build BAS Weather Font Controls
on:
  push:
    branches: [ "weather-font-controls-v2-2" ]
    paths:
      - 'bas-weather/**'
      - '.github/workflows/build-bas-weather.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build safe standalone weather APK
        run: gradle -p bas-weather :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BAS-Weather-Font-Controls-v2.2
          path: bas-weather/app/build/outputs/apk/debug/app-debug.apk
