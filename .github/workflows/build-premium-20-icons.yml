name: Build Premium 20 Icon Packs
on:
  push:
    branches: [ "premium-20-icon-packs" ]
    paths:
      - "babymonster-icon-pack/**"
      - "alnassr-icon-pack/**"
      - ".github/workflows/build-premium-20-icons.yml"
  workflow_dispatch:

jobs:
  build-babymonster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build BABYMONSTER 20 APK
        working-directory: babymonster-icon-pack
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BAS-BABYMONSTER-20-Premium
          path: babymonster-icon-pack/app/build/outputs/apk/debug/app-debug.apk

  build-alnassr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Al Nassr 20 APK
        working-directory: alnassr-icon-pack
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BAS-Al-Nassr-20-Premium
          path: alnassr-icon-pack/app/build/outputs/apk/debug/app-debug.apk
