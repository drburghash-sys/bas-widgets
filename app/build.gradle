plugins { id 'com.android.application' }
android {
    namespace 'com.bms.widgets'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bms.widgets'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '2.5'
        manifestPlaceholders = [displayName: 'BMS Widgets']
    }
    buildTypes {
        debug {
            // Stable, separate package: protects data stored in previous BAS Widgets installations.
            applicationIdSuffix '.prayerclock'
            manifestPlaceholders = [displayName: 'BAS Widgets - الصلاة والتاريخ']
        }
    }
}
