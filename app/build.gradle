plugins { id 'com.android.application' }
android {
    namespace 'com.bms.widgets'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bms.widgets'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '2.4'
        manifestPlaceholders = [displayName: 'BMS Widgets']
    }
    buildTypes {
        debug {
            // A separate installation is safer when the previous APK was signed with another key.
            applicationIdSuffix '.locationv23'
            manifestPlaceholders = [displayName: 'BAS Widgets - الإصدار المصحح']
        }
    }
}
