plugins { id 'com.android.application' }

android {
    namespace 'com.bms.widgets.weather'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bms.widgets.weather.fontsize'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.2'
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
}
